spring.datasource.url=jdbc:h2:mem:personal_management;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.private-
app.jwt.public-
app.jwt.access-token-expiration-milliseconds=900000
app.jwt.refresh-token-expiration-milliseconds=604800000
app.security.cookies.secure=false
